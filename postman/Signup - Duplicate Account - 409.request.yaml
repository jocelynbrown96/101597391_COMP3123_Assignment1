$kind: http-request
description: ""
url: "{{baseUrl}}/api/v1/user/signup"
method: POST
body:
  type: json
  content: "{\r

    \  \"username\": \"{{testUsername}}\",\r

    \  \"email\": \"{{testEmail}}\",\r

    \  \"password\": \"StudyCoffee42!\"\r

    }"
scripts:
  - type: afterResponse
    code: "pm.test(\"Duplicate signup returns 409 Conflict\", function () {\r

      \    pm.response.to.have.status(409);\r

      });\r

      \r

      pm.test(\"Response explains the conflict without exposing credentials\", function () {\r

      \    const data = pm.response.json();\r

      \r

      \    pm.expect(data.message)\r

      \        .to.equal(\"Username or email already exists.\");\r

      \    pm.expect(data).not.to.have.property(\"password\");\r

      \    pm.expect(data).not.to.have.property(\"token\");\r

      });"
    language: text/javascript
order: 11000
