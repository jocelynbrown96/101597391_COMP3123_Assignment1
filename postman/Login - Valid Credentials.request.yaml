$kind: http-request
description: ""
url: "{{baseUrl}}/api/v1/user/login"
method: POST
body:
  type: json
  content: "{\r

    \  \"username\": \"{{testUsername}}\",\r

    \  \"password\": \"StudyCoffee42!\"\r

    }"
scripts:
  - type: afterResponse
    code: "// Clear any old token before checking this response.\r

      pm.collectionVariables.unset(\"token\");\r

      \r

      pm.test(\"Login returns 200 OK\", function () {\r

      \    pm.response.to.have.status(200);\r

      });\r

      \r

      pm.test(\"Successful login returns a token and user\", function () {\r

      \    pm.response.to.have.status(200);\r

      \r

      \    const data = pm.response.json();\r

      \r

      \    pm.expect(data.token).to.be.a(\"string\").and.not.empty;\r

      \    pm.expect(data.user).to.be.an(\"object\");\r

      \    pm.expect(data.user._id).to.be.a(\"string\").and.not.empty;\r

      \    pm.expect(data.user).not.to.have.property(\"password\");\r

      \r

      \    // Save the token only after these checks pass.\r

      \    pm.collectionVariables.set(\"token\", data.token);\r

      });"
    language: text/javascript
settings:
  protocolVersion: auto
  strictSSL: false
  followRedirects: true
  disableCookies: false
  maxResponseSize: 52428800
order: 1000
