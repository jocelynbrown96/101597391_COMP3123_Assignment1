$kind: http-request
description: ""
url: "{{baseUrl}}/api/v1/emp/employees/{{employeeId}}"
method: PUT
body:
  type: json
  content: "{\r

    \  \"first_name\": \"Avery\",\r

    \  \"last_name\": \"Taylor\",\r

    \  \"email\": \"avery.taylor@example.com\",\r

    \  \"position\": \"Senior Software Developer\",\r

    \  \"salary\": 85000,\r

    \  \"date_of_joining\": \"2026-10-19\",\r

    \  \"department\": \"Engineering\"\r

    }"
auth:
  type: bearer
  credentials:
    token: "{{token}}"
scripts:
  - type: afterResponse
    code: "pm.test(\"Employee update returns 200 OK\", function () {\r

      \    pm.response.to.have.status(200);\r

      });\r

      \r

      pm.test(\"Response shows the requested employee and updates\", function () {\r

      \    const employee = pm.response.json().employee;\r

      \    const requestedId = pm.collectionVariables.get(\"employeeId\");\r

      \r

      \    pm.expect(employee._id).to.equal(requestedId);\r

      \    pm.expect(employee.position).to.equal(\"Senior Software Developer\");\r

      \    pm.expect(employee.salary).to.equal(85000);\r

      \    pm.expect(employee.first_name).to.equal(\"Avery\");\r

      \    pm.expect(employee.email).to.equal(\"avery.taylor@example.com\");\r

      });"
    language: text/javascript
order: 6000
