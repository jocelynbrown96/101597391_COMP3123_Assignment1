$kind: http-request
description: ""
url: "{{baseUrl}}/api/v1/user/login"
method: POST
body:
  type: json
  content: "{\r

    \  \"username\": \"{{testUsername}}\",\r

    \  \"password\": \"DeliberatelyWrong123!\"\r

    }"
scripts:
  - type: afterResponse
    code: "pm.test(\"Wrong password returns 401 Unauthorized\", function () {\r

      \    pm.response.to.have.status(401);\r

      });\r

      \r

      pm.test(\"Response rejects credentials without issuing a token\", function () {\r

      \    const data = pm.response.json();\r

      \r

      \    pm.expect(data.message).to.equal(\"Invalid credentials.\");\r

      \    pm.expect(data).not.to.have.property(\"token\");\r

      \    pm.expect(data).not.to.have.property(\"password\");\r

      });"
    language: text/javascript
order: 9000
