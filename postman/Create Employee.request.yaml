$kind: http-request
description: ""
url: "{{baseUrl}}/api/v1/emp/employees"
method: POST
body:
  type: json
  content: "{\r

    \  \"first_name\": \"Avery\",\r

    \  \"last_name\": \"Taylor\",\r

    \  \"email\": \"avery.taylor@example.com\",\r

    \  \"position\": \"Software Developer\",\r

    \  \"salary\": 72000,\r

    \  \"date_of_joining\": \"2026-10-19\",\r

    \  \"department\": \"Engineering\"\r

    }"
auth:
  type: bearer
  credentials:
    token: "{{token}}"
scripts:
  - type: afterResponse
    code: "pm.collectionVariables.unset(\"employeeId\");\r

      \r

      pm.test(\"Employee creation returns 201 Created\", function () {\r

      \    pm.response.to.have.status(201);\r

      });\r

      \r

      pm.test(\"Created employee matches the submitted data\", function () {\r

      \    pm.response.to.have.status(201);\r

      \r

      \    const employee = pm.response.json().employee;\r

      \r

      \    pm.expect(employee._id).to.be.a(\"string\").and.not.empty;\r

      \    pm.expect(employee.first_name).to.equal(\"Avery\");\r

      \    pm.expect(employee.last_name).to.equal(\"Taylor\");\r

      \    pm.expect(employee.email).to.equal(\"avery.taylor@example.com\");\r

      \    pm.expect(employee.position).to.equal(\"Software Developer\");\r

      \    pm.expect(employee.salary).to.equal(72000);\r

      \    pm.expect(employee.department).to.equal(\"Engineering\");\r

      \    pm.expect(employee.date_of_joining.slice(0, 10))\r

      \        .to.equal(\"2026-10-19\");\r

      \r

      \    pm.collectionVariables.set(\"employeeId\", employee._id);\r

      });"
    language: text/javascript
order: 3000
